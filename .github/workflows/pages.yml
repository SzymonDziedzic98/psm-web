# Publikuje katalog web/ (index.html) razem z src/psm.py na GitHub Pages.
# Wymaga: Settings -> Pages -> Source: "GitHub Actions".
name: Strona PSM (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", "src/**", "models/Hall_AC_aversion.gaml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Testy modelu (python src/psm.py --test)
        run: python3 src/psm.py --test
      - name: Strona z modelem (web/ + src/psm.py + model GAML)
        run: |
          mkdir _site
          cp -r web/. _site/
          cp src/psm.py _site/psm.py
          cp models/Hall_AC_aversion.gaml _site/Hall_AC_aversion.gaml
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
